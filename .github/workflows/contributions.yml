name: Update contribution graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate contribution SVG
        run: node scripts/generate-contributions.mjs

      - name: Publish updated graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already up to date."
            exit 0
          fi
          git commit -m "Update contribution graph"
          git push
